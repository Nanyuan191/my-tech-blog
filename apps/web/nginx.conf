# ============================================================
# Nginx 站点配置 —— 同时承担「静态托管」和「API 反向代理」
# ============================================================
# 这个文件解决了两个关键问题：
#
# 1. 反向代理（/api/ → http://api:3000）
#    让前后端在浏览器看来是同源的。好处：
#      - 没有跨域问题，前端不用配 CORS
#      - 生产环境只需要暴露一个端口
#      - Cookie / Authorization 头天然可用
#
# 2. SPA history 路由回退（try_files ... /index.html）
#    Vue Router 的 history 模式在刷新 /posts/123 时，
#    浏览器会真的向服务器请求 /posts/123 这个路径。
#    Nginx 上并没有这个文件 → 404。
#    所以要让"找不到文件就返回 index.html"，交给前端路由自己处理。
#    这是 SPA 部署最常见的坑，答辩时能讲清楚很加分。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩 ----
    # 对文本类资源压缩比通常能达到 70%，首屏加载明显变快
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # 把真实客户端信息传给后端，否则后端看到的所有请求都来自 nginx 容器，
        # 限流和日志都会失真
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置：后端冷启动可能稍慢，给 60s 余量
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- 带 hash 的静态资源：强缓存一年 ----
    # Vite 构建产物文件名里带了内容 hash（如 index-a1b2c3.js），
    # 内容变了文件名就变，所以可以放心地让浏览器长期缓存。
    # 这是前端性能优化的标准做法。
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存 —— 否则发新版本后用户还在加载旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
