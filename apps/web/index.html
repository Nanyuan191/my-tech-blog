<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      favicon 用 SVG：一个文件适配所有分辨率，不用再出 ico 的 16/32/48 三份。
      public/ 目录下的文件会被 Vite 原样拷进构建产物根目录，所以路径直接写 /favicon.svg。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="个人技术博客 —— 记录开发过程中的思考与实践" />
    <title>循环往复的视界——鸢</title>
    <!--
      防「闪白」小脚本（FOUC = Flash Of Unstyled Content）：
      Vue 的 JS 要等下载+执行完才会去设置主题，这中间会先闪一下浅色。
      所以把「读 localStorage 并加 dark class」提到 head 里先跑一遍，
      等 stores/theme.ts 启动时看到 class 已存在，视觉上就完全无跳变。
    -->
    <script>
      (function () {
        try {
          // 深色模式暂时下线（2026-10-03）：与 stores/theme.ts 的 DARK_MODE_ENABLED 保持一致，
          // 恢复时两处一起改回 true
          var DARK_MODE_ENABLED = false;
          var saved = localStorage.getItem('blog-theme');
          var dark =
            DARK_MODE_ENABLED &&
            (saved === 'dark' ||
              (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* 隐私模式下 localStorage 可能不可用，忽略即可，退化成跟随系统 */
        }
      })();
    </script>
  </head>
  <body>
    <!-- Vue 应用挂载点 -->
    <div id="app"></div>
    <!-- 模块入口：Vite 会从这里开始解析依赖图 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
