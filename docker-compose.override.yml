# ============================================================
# docker-compose.override.yml —— 本地开发专用覆盖
# ============================================================
# ⚠️ 重要：这个文件是给「本地开发」用的，不要提交到生产环境！
#
# 背景：docker-compose.yml 里 db 服务刻意没有映射端口 ——
# 那是为生产环境设计的最小暴露面原则（数据库只在容器网络内可见）。
# 但本地开发时，跑在宿主机上的 `npm run dev` 需要连数据库，
# 这就必须把 3306 映射出来。
#
# Docker Compose 会自动加载这个文件（不需要 -f 指定），
# 所以本地 `docker compose up -d db` 就能直接连上。
#
# 生产环境用：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   （显式指定 -f 时，override.yml 不会被加载 —— 这正是我们要的隔离）

services:
  db:
    ports:
      # 只绑定到 127.0.0.1，不绑 0.0.0.0。
      # 这样即使这台机器在公网，3306 也不会被外部扫描到，
      # 只有本机的进程能连。开发方便与安全兼得。
      - "127.0.0.1:3306:3306"
